<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARN</title><meta name="theme-color" content="#F4F7F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--ink:#12211B;--muted:#5B6B63;--green:#0B6B4F;--green2:#DDEFE6;--amber:#F2B33D;--amber2:#FCE9BE;--border:#DCE5E0;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.app{min-height:100dvh;max-width:720px;margin:auto;padding:20px 20px 96px}.brand{font-weight:800;letter-spacing:.08em;color:var(--green);font-size:18px}.hero{padding:72px 0 32px}.hero h1{font-size:40px;line-height:1.06;letter-spacing:-.04em;margin:12px 0 18px;max-width:540px}.hero p,.muted{color:var(--muted);line-height:1.55}.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin:16px 0}.actions{display:grid;gap:12px}.btn{min-height:52px;width:100%;border:1px solid var(--green);border-radius:14px;font:600 16px inherit;cursor:pointer;padding:0 18px}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--green)}.btn:disabled{opacity:.65;cursor:wait}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:600}.field input{height:52px;border:1px solid #A9B8B0;border-radius:12px;padding:0 14px;font:16px inherit;color:var(--ink);background:white}.hint{font-size:13px;color:var(--muted)}.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role button{min-height:48px;border:1px solid var(--border);border-radius:12px;background:white;font:600 15px inherit}.role button[aria-pressed=true]{border-color:var(--green);background:var(--green2);color:var(--green)}.error{background:#fff1ef;border:1px solid #e2aaa4;color:#762d24;border-radius:12px;padding:12px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logout{min-height:44px;border:0;background:transparent;color:var(--green);font:600 14px inherit}.page-title{font-size:30px;letter-spacing:-.03em;margin:30px 0 8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--border);display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-bottom)) 8px}.tabs{width:min(720px,100%);display:grid}.tabs button{min-height:52px;border:0;background:transparent;color:var(--muted);font:600 13px inherit;border-radius:12px}.tabs button[aria-current=page]{background:var(--green2);color:var(--green)}.back{min-height:44px;border:0;background:transparent;color:var(--green);padding:0;font:600 14px inherit}@media(max-width:420px){.app{padding:18px 16px 92px}.hero{padding-top:56px}.hero h1{font-size:36px}}@media(min-width:760px){.hero{padding-top:100px}.card{padding:28px}}
</style></head><body><main id="app" class="app"></main><nav id="bottom" class="bottom" hidden></nav>
<script src="/public/strings.js"></script><script src="/public/client.js"></script><script>
const S=window.EARN_STRINGS,A=window.EARN_API,app=document.querySelector("#app"),bottom=document.querySelector("#bottom");
let state={screen:"landing",role:"EARNER",user:null,tab:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 bottom.hidden=true;
 if(state.screen==="landing")return landing();
 if(state.screen==="signin"||state.screen==="signup")return auth();
 return shell();
}
function landing(){app.innerHTML='<div class="hero"><div class="brand">'+S.brand+'</div><h1>'+S.tagline+'</h1><p>'+S.landingSupport+'</p></div><div class="actions"><button class="btn primary" id="signin">'+S.signIn+'</button><button class="btn secondary" id="signup">'+S.createAccount+'</button></div>';onclick("signin",()=>{state.screen="signin";render()});onclick("signup",()=>{state.screen="signup";render()})}
function auth(){const signup=state.screen==="signup";app.innerHTML='<button class="back" id="back">← '+S.back+'</button><div class="card"><div class="brand">'+S.brand+'</div><h1>'+(signup?S.createAccount:S.signIn)+'</h1><form id="form"><div class="field"><label for="phone">'+S.mobile+'</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel" required><span class="hint">'+S.phoneHint+'</span></div><div class="field"><label for="password">'+S.password+'</label><input id="password" name="password" type="password" autocomplete="'+(signup?"new-password":"current-password")+'" minlength="8" required><span class="hint">'+S.passwordHint+'</span></div>'+'<div class="field"><label>'+S.chooseRole+'</label><div class="role"><button type="button" data-role="EARNER" aria-pressed="'+(state.role==="EARNER")+'">'+S.earner+'</button><button type="button" data-role="BUSINESS" aria-pressed="'+(state.role==="BUSINESS")+'">'+S.business+'</button></div></div>'+(signup?'<div class="field"><label for="profileName">'+(state.role==="EARNER"?S.name:S.businessName)+'</label><input id="profileName" name="profileName" required></div>':'')+'<div id="error" role="alert"></div><button class="btn primary" id="submit" type="submit">'+(signup?S.createAccount:S.signIn)+'</button></form></div>';onclick("back",()=>{state.screen="landing";render()});document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});document.querySelector("#form").onsubmit=e=>submitAuth(e,signup)}
async function submitAuth(e,signup){e.preventDefault();const f=new FormData(e.currentTarget),btn=document.querySelector("#submit"),err=document.querySelector("#error");btn.disabled=true;btn.textContent=signup?S.creating:S.signingIn;err.innerHTML="";try{const phone=f.get("phone"),password=f.get("password");const data=signup?await A.signup({phone,password,role:state.role,...(state.role==="EARNER"?{displayName:f.get("profileName")}:{businessName:f.get("profileName")})}):await A.login(phone,password);if(data.role!==state.role)throw new Error(S.roleMismatch);A.saveToken(data.token);state.user=data.user;state.role=data.role;state.screen="shell";state.tab=state.role==="EARNER"?S.home:S.campaigns;render()}catch(x){err.className="error";err.textContent=x.message||S.authError;btn.disabled=false;btn.textContent=signup?S.createAccount:S.signIn}}
function shell(){const tabs=state.role==="EARNER"?[S.home,S.sell,S.orders,S.money]:[S.campaigns,S.orders,S.money];if(!state.tab)state.tab=tabs[0];app.innerHTML='<div class="top"><div class="brand">'+S.brand+'</div><button class="logout" id="logout">'+S.logout+'</button></div><h1 class="page-title">'+esc(state.tab)+'</h1><p class="muted">'+S.nextStage+'</p><div class="card"><strong>'+S.welcome+(state.user?.displayName?" "+esc(state.user.displayName):state.user?.business?.name?" "+esc(state.user.business.name):"")+'.</strong><p class="muted">'+(state.role==="EARNER"?S.earner:S.business)+' '+S.signedInSuffix+'</p></div>';bottom.hidden=false;bottom.innerHTML='<div class="tabs" style="grid-template-columns:repeat('+tabs.length+',1fr)">'+tabs.map(x=>'<button data-tab="'+x+'" aria-current="'+(x===state.tab?"page":"false")+'">'+x+'</button>').join("")+'</div>';onclick("logout",()=>{A.clearToken();state={screen:"landing",role:"EARNER",user:null,tab:null};render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function onclick(id,fn){document.querySelector("#"+id).onclick=fn}
async function boot(){if(!A.token())return render();try{const u=await A.me();state.user=u;state.role=u.role;if(!["EARNER","BUSINESS"].includes(u.role)){A.clearToken();return render()}state.screen="shell";state.tab=u.role==="EARNER"?S.home:S.campaigns}catch{A.clearToken()}render()}boot();
</script></body></html>
