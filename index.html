<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARN</title><meta name="theme-color" content="#F4F7F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--ink:#12211B;--muted:#5B6B63;--green:#0B6B4F;--green2:#DDEFE6;--amber:#F2B33D;--amber2:#FCE9BE;--border:#DCE5E0;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.app{min-height:100dvh;max-width:720px;margin:auto;padding:20px 20px 96px}.brand{font-weight:800;letter-spacing:.08em;color:var(--green);font-size:18px}.hero{padding:72px 0 32px}.hero h1{font-size:40px;line-height:1.06;letter-spacing:-.04em;margin:12px 0 18px;max-width:540px}.hero p,.muted{color:var(--muted);line-height:1.55}.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin:16px 0}.actions{display:grid;gap:12px}.btn{min-height:52px;width:100%;border:1px solid var(--green);border-radius:14px;font:600 16px inherit;cursor:pointer;padding:0 18px}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--green)}.btn:disabled{opacity:.65;cursor:wait}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:600}.field input{height:52px;border:1px solid #A9B8B0;border-radius:12px;padding:0 14px;font:16px inherit;color:var(--ink);background:white}.hint{font-size:13px;color:var(--muted)}.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role button{min-height:48px;border:1px solid var(--border);border-radius:12px;background:white;font:600 15px inherit}.role button[aria-pressed=true]{border-color:var(--green);background:var(--green2);color:var(--green)}.error{background:#fff1ef;border:1px solid #e2aaa4;color:#762d24;border-radius:12px;padding:12px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logout{min-height:44px;border:0;background:transparent;color:var(--green);font:600 14px inherit}.page-title{font-size:30px;letter-spacing:-.03em;margin:30px 0 8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--border);display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-bottom)) 8px}.tabs{width:min(720px,100%);display:grid}.tabs button{min-height:52px;border:0;background:transparent;color:var(--muted);font:600 13px inherit;border-radius:12px}.tabs button[aria-current=page]{background:var(--green2);color:var(--green)}.section{margin:28px 0 10px}.section h2{font-size:20px;margin:0 0 12px}.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.money{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px}.money strong{display:block;font-size:22px;margin-top:6px}.product{cursor:pointer;text-align:left;width:100%;font:inherit}.product h3,.order h3{margin:0 0 6px;font-size:17px}.earn{color:var(--green);font-weight:700}.chip{display:inline-block;background:var(--green2);color:var(--green);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.empty{border:1px dashed #A9B8B0;border-radius:16px;padding:20px;color:var(--muted);line-height:1.5}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}.stepper button{height:52px;border:1px solid var(--border);border-radius:12px;background:white;font-size:24px}.stepper output{text-align:center;font-size:24px;font-weight:700}.earnbox{background:var(--green2);border-radius:16px;padding:18px;margin:18px 0}.earnbox strong{display:block;color:var(--green);font-size:28px;margin-top:4px}.linkbox{word-break:break-all;background:var(--bg);border-radius:12px;padding:12px;font-size:13px}.inline-actions{display:grid;gap:10px;margin-top:12px}.warn{background:var(--amber2);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}.smallbtn{min-height:44px;border:1px solid var(--green);background:white;color:var(--green);border-radius:12px;font:600 14px inherit;padding:0 14px}.back{min-height:44px;border:0;background:transparent;color:var(--green);padding:0;font:600 14px inherit}@media(max-width:420px){.app{padding:18px 16px 92px}.hero{padding-top:56px}.hero h1{font-size:36px}}@media(min-width:760px){.hero{padding-top:100px}.card{padding:28px}}
</style></head><body><main id="app" class="app"></main><nav id="bottom" class="bottom" hidden></nav>
<script src="/public/strings.js"></script><script src="/public/client.js"></script><script>
const S=window.EARN_STRINGS,A=window.EARN_API,app=document.querySelector("#app"),bottom=document.querySelector("#bottom");
let state={screen:"landing",role:"EARNER",user:null,tab:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 bottom.hidden=true;
 if(state.screen==="landing")return landing();
 if(state.screen==="signin"||state.screen==="signup")return auth();
 return shell();
}
function landing(){app.innerHTML='<div class="hero"><div class="brand">'+S.brand+'</div><h1>'+S.tagline+'</h1><p>'+S.landingSupport+'</p></div><div class="actions"><button class="btn primary" id="signin">'+S.signIn+'</button><button class="btn secondary" id="signup">'+S.createAccount+'</button></div>';onclick("signin",()=>{state.screen="signin";render()});onclick("signup",()=>{state.screen="signup";render()})}
function auth(){const signup=state.screen==="signup";app.innerHTML='<button class="back" id="back">← '+S.back+'</button><div class="card"><div class="brand">'+S.brand+'</div><h1>'+(signup?S.createAccount:S.signIn)+'</h1><form id="form"><div class="field"><label for="phone">'+S.mobile+'</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel" required><span class="hint">'+S.phoneHint+'</span></div><div class="field"><label for="password">'+S.password+'</label><input id="password" name="password" type="password" autocomplete="'+(signup?"new-password":"current-password")+'" minlength="8" required><span class="hint">'+S.passwordHint+'</span></div>'+'<div class="field"><label>'+S.chooseRole+'</label><div class="role"><button type="button" data-role="EARNER" aria-pressed="'+(state.role==="EARNER")+'">'+S.earner+'</button><button type="button" data-role="BUSINESS" aria-pressed="'+(state.role==="BUSINESS")+'">'+S.business+'</button></div></div>'+(signup?'<div class="field"><label for="profileName">'+(state.role==="EARNER"?S.name:S.businessName)+'</label><input id="profileName" name="profileName" required></div>':'')+'<div id="error" role="alert"></div><button class="btn primary" id="submit" type="submit">'+(signup?S.createAccount:S.signIn)+'</button></form></div>';onclick("back",()=>{state.screen="landing";render()});document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});document.querySelector("#form").onsubmit=e=>submitAuth(e,signup)}
async function submitAuth(e,signup){e.preventDefault();const f=new FormData(e.currentTarget),btn=document.querySelector("#submit"),err=document.querySelector("#error");btn.disabled=true;btn.textContent=signup?S.creating:S.signingIn;err.innerHTML="";try{const phone=f.get("phone"),password=f.get("password");const data=signup?await A.signup({phone,password,role:state.role,...(state.role==="EARNER"?{displayName:f.get("profileName")}:{businessName:f.get("profileName")})}):await A.login(phone,password);if(data.role!==state.role)throw new Error(S.roleMismatch);A.saveToken(data.token);state.user=data.user;state.role=data.role;state.screen="shell";state.tab=state.role==="EARNER"?S.home:S.campaigns;render()}catch(x){err.className="error";err.textContent=x.message||S.authError;btn.disabled=false;btn.textContent=signup?S.createAccount:S.signIn}}
function shell(){const tabs=state.role==="EARNER"?[S.home,S.sell,S.orders,S.money]:[S.campaigns,S.orders,S.money];if(!state.tab)state.tab=tabs[0];app.innerHTML='<div class="top"><div class="brand">'+S.brand+'</div><button class="logout" id="logout">'+S.logout+'</button></div><div id="view"></div>';bottom.hidden=false;bottom.innerHTML='<div class="tabs" style="grid-template-columns:repeat('+tabs.length+',1fr)">'+tabs.map(x=>'<button data-tab="'+x+'" aria-current="'+(x===state.tab?"page":"false")+'">'+x+'</button>').join("")+'</div>';onclick("logout",()=>{A.clearToken();state={screen:"landing",role:"EARNER",user:null,tab:null};render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.selectedCampaign=null;state.saleResult=null;state.attemptKey=null;shell()});if(state.role!=="EARNER")return placeholder();if(state.tab===S.home)return earnerHome();if(state.tab===S.sell)return sellScreen();if(state.tab===S.orders)return ordersScreen();if(state.tab===S.money)return moneyScreen()}
function placeholder(){document.querySelector("#view").innerHTML='<h1 class="page-title">'+esc(state.tab)+'</h1><p class="muted">'+S.nextStage+'</p>'}
const npr=p=>new Intl.NumberFormat("en-NP",{maximumFractionDigits:2}).format(Number(p||0)/100);
const unitEarn=c=>{if(c.commissionBasis!=="PER_UNIT")return 0;return Math.round(Number(c.businessCommissionPaisa||0)*Number(c.earnerShareBps||10000)/10000)};
const statusText=x=>({SUBMITTED:S.statusSubmitted,CUSTOMER_CONFIRMED:S.statusConfirmed,ACCEPTED:S.statusAccepted,PAYMENT_PENDING:S.statusPayment,PAID:S.statusPaid,READY_FOR_PICKUP:S.statusReady,PICKED_UP:S.statusPicked,OUT_FOR_DELIVERY:S.statusDelivery,DELIVERED:S.statusDelivered,VERIFIED:S.statusVerified,PARTIALLY_DELIVERED:S.statusPartial,CANCELLED:S.statusCancelled,RETURNED:S.statusReturned,DISPUTED:S.statusDisputed}[x]||String(x||"").replaceAll("_"," ").toLowerCase());
async function earnerData(){const [campaigns,orders,earnings]=await Promise.all([A.campaigns(),A.myOrders(),A.myEarnings()]);return {campaigns:campaigns.filter(c=>c.type==="ORDER"&&c.commissionBasis==="PER_UNIT"),orders,earnings}}
async function earnerHome(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.welcome+(state.user?.displayName?" "+esc(state.user.displayName):"")+'</h1><p class="muted">'+S.sellEarn+'</p>';try{const d=await earnerData();state.homeData=d;const payable=d.orders.flatMap(o=>o.settlements||[]).filter(x=>x.partyType==="EARNER"&&x.status==="PAYABLE").reduce((n,x)=>n+Number(x.amountPaisa||0),0),coming=Math.max(0,Number(d.earnings.balancePaisa||0)-payable);v.innerHTML+='<section class="section">'+(d.earnings.entries.length?'<div class="money-grid"><div class="money"><span class="muted">'+S.ready+'</span><strong>Rs '+npr(payable)+'</strong></div><div class="money"><span class="muted">'+S.onWay+'</span><strong>Rs '+npr(coming)+'</strong></div></div>':'<div class="empty">'+S.noEarnings+'</div>')+'<button class="btn secondary" disabled style="margin-top:12px">'+S.withdraw+' · '+S.nextStage+'</button><p class="hint">'+S.withdrawSoon+'</p></section><section class="section"><h2>'+S.sellEarn+'</h2><div id="products">'+productsHtml(d.campaigns)+'</div></section><section class="section"><h2>'+S.yourOrders+'</h2>'+ordersHtml(d.orders.slice(0,5),false)+'</section>';wireProducts()}catch(e){showLoadError(v,e)}}
function productsHtml(rows){if(!rows.length)return '<div class="empty">'+S.noProducts+'</div>';return rows.map(c=>'<button class="card product" data-campaign="'+esc(c.id)+'"><h3>'+esc(c.title)+'</h3><div class="muted">'+esc(c.business?.name||"")+'</div><p class="earn">'+S.youEarn+' Rs '+npr(unitEarn(c))+' '+S.perUnit+'</p></button>').join("")}
function wireProducts(){document.querySelectorAll("[data-campaign]").forEach(b=>b.onclick=()=>{const rows=state.homeData?.campaigns||state.campaigns||[];state.selectedCampaign=rows.find(c=>c.id===b.dataset.campaign);state.tab=S.sell;state.saleResult=null;state.attemptKey=null;shell()})}
async function sellScreen(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.sell+'</h1>';if(!state.selectedCampaign){if(state.saleResult){v.innerHTML+='<div id="saleResult"></div>';renderSaleResult(state.saleResult);return}try{state.campaigns=(await A.campaigns()).filter(c=>c.type==="ORDER"&&c.commissionBasis==="PER_UNIT");v.innerHTML+='<p class="muted">'+S.chooseProduct+'</p>'+productsHtml(state.campaigns);wireProducts()}catch(e){showLoadError(v,e)}return}const c=state.selectedCampaign,q=state.qty||1;v.innerHTML+='<div class="card"><h3>'+esc(c.title)+'</h3><div class="muted">'+esc(c.business?.name||"")+'</div><p class="earn">'+S.youEarn+' Rs '+npr(unitEarn(c))+' '+S.perUnit+'</p></div><form id="saleForm"><div class="field"><label for="buyerName">'+S.buyerName+'</label><input id="buyerName" name="buyerName" required minlength="2"></div><div class="field"><label for="buyerPhone">'+S.buyerPhone+'</label><input id="buyerPhone" name="buyerPhone" inputmode="numeric" required></div><div class="field"><label>'+S.quantity+'</label><div class="stepper"><button type="button" id="minus">−</button><output id="qty">'+q+'</output><button type="button" id="plus">+</button></div></div><div class="earnbox">'+S.youEarn+'<strong id="earnTotal">Rs '+npr(unitEarn(c)*q)+'</strong></div><div id="saleError" role="alert"></div><button class="btn primary" id="send" type="submit">'+S.sendBuyer+'</button></form><div id="saleResult"></div>';const reset=()=>{state.attemptKey=null};document.querySelectorAll("#saleForm input").forEach(x=>x.oninput=reset);onclick("minus",()=>changeQty(-1));onclick("plus",()=>changeQty(1));document.querySelector("#saleForm").onsubmit=createSale;if(state.saleResult)renderSaleResult(state.saleResult)}
function changeQty(delta){state.qty=Math.max(1,(state.qty||1)+delta);state.attemptKey=null;document.querySelector("#qty").textContent=state.qty;document.querySelector("#earnTotal").textContent="Rs "+npr(unitEarn(state.selectedCampaign)*state.qty)}
async function createSale(e){e.preventDefault();const f=new FormData(e.currentTarget),btn=document.querySelector("#send"),err=document.querySelector("#saleError");btn.disabled=true;btn.textContent=S.sending;err.innerHTML="";if(!state.attemptKey)state.attemptKey=crypto.randomUUID();try{const a=await A.startSale(state.selectedCampaign.id);const o=await A.createOrder({idempotencyKey:state.attemptKey,attributionCode:a.code,customerName:f.get("buyerName"),customerPhone:f.get("buyerPhone"),product:state.selectedCampaign.title,quantity:state.qty||1});if(!o.customerConfirmationPath)throw new Error(S.retryLinkError);state.saleResult={id:o.id,status:o.status,url:new URL(o.customerConfirmationPath,location.origin).href};state.attemptKey=null;renderSaleResult(state.saleResult);btn.disabled=false;btn.textContent=S.sendBuyer}catch(x){err.className="error";err.textContent=plainError(x.message);btn.disabled=false;btn.textContent=S.sendBuyer}}
function renderSaleResult(x){const box=document.querySelector("#saleResult");if(!box)return;box.innerHTML='<div class="card"><h3>'+S.orderCreated+'</h3><div class="linkbox">'+esc(x.url)+'</div><div class="inline-actions"><button class="smallbtn" id="copy">'+S.copyLink+'</button><button class="smallbtn" id="wa">'+S.shareWhatsApp+'</button></div></div>';onclick("copy",async()=>{await navigator.clipboard.writeText(x.url);document.querySelector("#copy").textContent=S.copied});onclick("wa",()=>{const msg=S.buyerMessage+" "+x.url;window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener,noreferrer")})}
function ordersHtml(rows,actions=true){if(!rows.length)return '<div class="empty">'+S.noOrders+'</div>';return rows.map(o=>'<div class="card order"><h3>'+esc(o.product)+'</h3><span class="chip">'+esc(statusText(o.status))+'</span><p class="muted">'+S.quantity+': '+esc(o.quantity)+'</p>'+(actions&&o.status==="SUBMITTED"?'<div class="warn">'+S.reissueWarning+'</div><button class="smallbtn reissue" data-order="'+esc(o.id)+'">'+S.getAgain+'</button>':'')+'</div>').join("")}
async function ordersScreen(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.yourOrders+'</h1>';try{const rows=await A.myOrders();v.innerHTML+=ordersHtml(rows,true);document.querySelectorAll(".reissue").forEach(b=>b.onclick=()=>reissue(b.dataset.order,b))}catch(e){showLoadError(v,e)}}
async function reissue(id,btn){if(!confirm(S.reissueConfirm))return;btn.disabled=true;btn.textContent=S.gettingLink;try{const x=await A.reissueBuyerLink(id),url=new URL(x.customerConfirmationPath,location.origin).href;state.saleResult={id:x.id,status:x.status,url};state.tab=S.sell;state.selectedCampaign=null;shell()}catch(e){alert(plainError(e.message));btn.disabled=false;btn.textContent=S.getAgain}}
async function moneyScreen(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.money+'</h1>';try{const d=await earnerData(),payable=d.orders.flatMap(o=>o.settlements||[]).filter(x=>x.partyType==="EARNER"&&x.status==="PAYABLE").reduce((n,x)=>n+Number(x.amountPaisa||0),0),coming=Math.max(0,Number(d.earnings.balancePaisa||0)-payable);v.innerHTML+=d.earnings.entries.length?'<div class="money-grid"><div class="money"><span class="muted">'+S.ready+'</span><strong>Rs '+npr(payable)+'</strong></div><div class="money"><span class="muted">'+S.onWay+'</span><strong>Rs '+npr(coming)+'</strong></div></div>':'<div class="empty">'+S.noEarnings+'</div>';v.innerHTML+='<button class="btn secondary" disabled style="margin-top:12px">'+S.withdraw+' · '+S.nextStage+'</button><p class="hint">'+S.withdrawSoon+'</p>'}catch(e){showLoadError(v,e)}}
function plainError(m){if(/cap/i.test(m))return S.capError;if(/already has an active|duplicate/i.test(m))return S.duplicateError;return m||S.authError}
function showLoadError(v,e){v.innerHTML+='<div class="error">'+esc(plainError(e.message)||S.loadError)+'</div><button class="btn secondary" id="retry">'+S.refresh+'</button>';onclick("retry",shell)}
function onclick(id,fn){document.querySelector("#"+id).onclick=fn}
async function boot(){if(!A.token())return render();try{const u=await A.me();state.user=u;state.role=u.role;if(!["EARNER","BUSINESS"].includes(u.role)){A.clearToken();return render()}state.screen="shell";state.tab=u.role==="EARNER"?S.home:S.campaigns}catch{A.clearToken()}render()}boot();
</script></body></html>
