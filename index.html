<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARN</title><meta name="theme-color" content="#F4F7F5"><meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--ink:#12211B;--muted:#5B6B63;--green:#0B6B4F;--green2:#DDEFE6;--amber:#F2B33D;--amber2:#FCE9BE;--border:#DCE5E0;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.app{min-height:100dvh;max-width:720px;margin:auto;padding:20px 20px 96px}.brand{font-weight:800;letter-spacing:.08em;color:var(--green);font-size:18px}.hero{padding:72px 0 32px}.hero h1{font-size:40px;line-height:1.06;letter-spacing:-.04em;margin:12px 0 18px;max-width:540px}.hero p,.muted{color:var(--muted);line-height:1.55}.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin:16px 0}.actions{display:grid;gap:12px}.btn{min-height:52px;width:100%;border:1px solid var(--green);border-radius:14px;font:600 16px inherit;cursor:pointer;padding:0 18px}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--green)}.btn:disabled{opacity:.65;cursor:wait}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:600}.field input{height:52px;border:1px solid #A9B8B0;border-radius:12px;padding:0 14px;font:16px inherit;color:var(--ink);background:white}.hint{font-size:13px;color:var(--muted)}.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role button{min-height:48px;border:1px solid var(--border);border-radius:12px;background:white;font:600 15px inherit}.role button[aria-pressed=true]{border-color:var(--green);background:var(--green2);color:var(--green)}.error{background:#fff1ef;border:1px solid #e2aaa4;color:#762d24;border-radius:12px;padding:12px;margin:12px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logout{min-height:44px;border:0;background:transparent;color:var(--green);font:600 14px inherit}.page-title{font-size:30px;letter-spacing:-.03em;margin:30px 0 8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--border);display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-bottom)) 8px}.tabs{width:min(720px,100%);display:grid}.tabs button{min-height:52px;border:0;background:transparent;color:var(--muted);font:600 13px inherit;border-radius:12px}.tabs button[aria-current=page]{background:var(--green2);color:var(--green)}.section{margin:28px 0 10px}.section h2{font-size:20px;margin:0 0 12px}.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.money{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px}.money strong{display:block;font-size:22px;margin-top:6px}.product{cursor:pointer;text-align:left;width:100%;font:inherit}.product h3,.order h3{margin:0 0 6px;font-size:17px}.earn{color:var(--green);font-weight:700}.chip{display:inline-block;background:var(--green2);color:var(--green);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.empty{border:1px dashed #A9B8B0;border-radius:16px;padding:20px;color:var(--muted);line-height:1.5}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}.stepper button{height:52px;border:1px solid var(--border);border-radius:12px;background:white;font-size:24px}.stepper output{text-align:center;font-size:24px;font-weight:700}.earnbox{background:var(--green2);border-radius:16px;padding:18px;margin:18px 0}.earnbox strong{display:block;color:var(--green);font-size:28px;margin-top:4px}.linkbox{word-break:break-all;background:var(--bg);border-radius:12px;padding:12px;font-size:13px}.inline-actions{display:grid;gap:10px;margin-top:12px}.warn{background:var(--amber2);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}.smallbtn{min-height:44px;border:1px solid var(--green);background:white;color:var(--green);border-radius:12px;font:600 14px inherit;padding:0 14px}.summary{display:grid;gap:10px}.summary-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border)}.summary-row:last-child{border-bottom:0}.summary-row span:first-child{color:var(--muted)}.trust{background:var(--green2);border-radius:16px;padding:16px;line-height:1.55}.placeholder{background:var(--amber2);border-radius:16px;padding:16px;line-height:1.5}.buyer-head{padding:12px 0 8px}.buyer-head .brand{margin-bottom:28px}.buyer-actions{display:grid;gap:10px;margin-top:20px}.danger{background:white;color:#762d24;border-color:#b75b50}.timeline{margin:20px 0}.track-step{position:relative;padding:0 0 24px 42px}.track-step:before{content:"";position:absolute;left:14px;top:28px;bottom:0;width:2px;background:var(--border)}.track-step:last-child:before{display:none}.dot{position:absolute;left:4px;top:2px;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#EEF1EF}.track-step.done .dot{background:var(--green);border-color:var(--green)}.track-step.current .dot{background:var(--amber);border-color:#B77C0A}.track-step h3{font-size:16px;margin:0 0 4px}.track-step p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}.step-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.done .step-label{color:var(--green)}.current .step-label{color:#8A5A00}.upcoming .step-label{color:var(--muted)}select,textarea{width:100%;border:1px solid #A9B8B0;border-radius:12px;padding:13px 14px;font:16px inherit;color:var(--ink);background:white}textarea{min-height:100px;resize:vertical}.share-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.share-chips button{min-height:44px;border:1px solid var(--border);background:white;border-radius:12px;font:600 14px inherit}.share-chips button[aria-pressed=true]{background:var(--green2);border-color:var(--green);color:var(--green)}.splitbar{height:14px;background:var(--border);border-radius:999px;overflow:hidden;margin:12px 0}.splitbar span{display:block;height:100%;background:var(--green)}.splitnums{display:flex;justify-content:space-between;gap:12px;font-weight:700}.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.back{min-height:44px;border:0;background:transparent;color:var(--green);padding:0;font:600 14px inherit}@media(max-width:420px){.app{padding:18px 16px 92px}.hero{padding-top:56px}.hero h1{font-size:36px}}@media(min-width:760px){.hero{padding-top:100px}.card{padding:28px}}

.product-media{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;margin:0 0 12px;background:#f2f4f7;display:block}
.image-picker{border:1px dashed #aab4c3;border-radius:14px;padding:14px;background:#fafbfc}
.image-picker input{width:100%}
.image-previews{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.image-previews img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eef1f5}
.image-note{font-size:12px;color:#667085;margin-top:7px}

.market-card{padding:0;overflow:hidden}.market-body{padding:16px 18px 18px}.market-brand{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.market-price{font-weight:700}.market-earn{font-size:24px;color:var(--green);font-weight:800;margin:8px 0}.market-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.gallery-main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#eef1f5}.gallery-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.gallery-strip button{padding:0;border:0;background:none}.gallery-strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.verified{color:var(--green);font-weight:700}.sales-points{padding-left:20px;line-height:1.65}.commission-box{background:var(--green2);border-radius:16px;padding:16px;margin:16px 0}.commission-box strong{display:block;font-size:25px;color:var(--green)}.sticky-action{position:sticky;bottom:72px;background:linear-gradient(transparent,var(--bg) 25%);padding-top:24px}.field textarea,.field select{min-height:52px;border:1px solid #A9B8B0;border-radius:12px;padding:12px 14px;font:16px inherit;color:var(--ink);background:white}.field textarea{min-height:100px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview-item{position:relative}.preview-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.preview-controls{display:flex;gap:3px;margin-top:4px}.preview-controls button{min-width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:white}.faq-row{display:grid;gap:6px;margin:10px 0}.public-product{max-width:560px;margin:auto}.offer{background:var(--amber2);border-radius:14px;padding:14px;margin:14px 0}
</style></head><body><main id="app" class="app"></main><nav id="bottom" class="bottom" hidden></nav>
<script src="/public/strings.js"></script><script src="/public/client.js"></script><script>
const S=window.EARN_STRINGS,A=window.EARN_API,app=document.querySelector("#app"),bottom=document.querySelector("#bottom");
let state={screen:"landing",role:"EARNER",user:null,tab:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 bottom.hidden=true;
 if(location.pathname==="/confirm-order"||location.pathname==="/order")return buyerPage();
 if(location.pathname==="/product")return publicProductPage();
 if(state.screen==="landing")return landing();
 if(state.screen==="signin"||state.screen==="signup")return auth();
 return shell();
}
function landing(){app.innerHTML='<div class="hero"><div class="brand">'+S.brand+'</div><h1>'+S.tagline+'</h1><p>'+S.landingSupport+'</p></div><div class="actions"><button class="btn primary" id="signin">'+S.signIn+'</button><button class="btn secondary" id="signup">'+S.createAccount+'</button></div>';onclick("signin",()=>{state.screen="signin";render()});onclick("signup",()=>{state.screen="signup";render()})}
function auth(){const signup=state.screen==="signup";app.innerHTML='<button class="back" id="back">← '+S.back+'</button><div class="card"><div class="brand">'+S.brand+'</div><h1>'+(signup?S.createAccount:S.signIn)+'</h1><form id="form"><div class="field"><label for="phone">'+S.mobile+'</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel" required><span class="hint">'+S.phoneHint+'</span></div><div class="field"><label for="password">'+S.password+'</label><input id="password" name="password" type="password" autocomplete="'+(signup?"new-password":"current-password")+'" minlength="8" required><span class="hint">'+S.passwordHint+'</span></div>'+'<div class="field"><label>'+S.chooseRole+'</label><div class="role"><button type="button" data-role="EARNER" aria-pressed="'+(state.role==="EARNER")+'">'+S.earner+'</button><button type="button" data-role="BUSINESS" aria-pressed="'+(state.role==="BUSINESS")+'">'+S.business+'</button></div></div>'+(signup?'<div class="field"><label for="profileName">'+(state.role==="EARNER"?S.name:S.businessName)+'</label><input id="profileName" name="profileName" required></div>':'')+'<div id="error" role="alert"></div><button class="btn primary" id="submit" type="submit">'+(signup?S.createAccount:S.signIn)+'</button></form></div>';onclick("back",()=>{state.screen="landing";render()});document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});document.querySelector("#form").onsubmit=e=>submitAuth(e,signup)}
async function submitAuth(e,signup){e.preventDefault();const f=new FormData(e.currentTarget),btn=document.querySelector("#submit"),err=document.querySelector("#error");btn.disabled=true;btn.textContent=signup?S.creating:S.signingIn;err.innerHTML="";try{const phone=f.get("phone"),password=f.get("password");const data=signup?await A.signup({phone,password,role:state.role,...(state.role==="EARNER"?{displayName:f.get("profileName")}:{businessName:f.get("profileName")})}):await A.login(phone,password);if(data.role!==state.role&&data.role!=="ADMIN")throw new Error(S.roleMismatch);A.saveToken(data.token);state.user=data.user;state.role=data.role;state.screen="shell";state.tab=state.role==="EARNER"?S.home:S.campaigns;render()}catch(x){err.className="error";err.textContent=x.message||S.authError;btn.disabled=false;btn.textContent=signup?S.createAccount:S.signIn}}
function shell(){const tabs=state.role==="EARNER"?[S.home,S.sell,S.orders,S.money]:state.role==="ADMIN"?["Exceptions"]:[S.campaigns,S.orders,S.money];if(!state.tab)state.tab=tabs[0];app.innerHTML='<div class="top"><div class="brand">'+S.brand+'</div><div><button class="logout" id="alerts">Notifications <span id="alertCount"></span></button><button class="logout" id="logout">'+S.logout+'</button></div></div><div id="view"></div>'; A.notifications().then(n=>{const el=document.querySelector("#alertCount");if(el&&n.unread)el.textContent="("+n.unread+")"}).catch(()=>{});bottom.hidden=false;bottom.innerHTML='<div class="tabs" style="grid-template-columns:repeat('+tabs.length+',1fr)">'+tabs.map(x=>'<button data-tab="'+x+'" aria-current="'+(x===state.tab?"page":"false")+'">'+x+'</button>').join("")+'</div>';onclick("logout",()=>{A.clearToken();state={screen:"landing",role:"EARNER",user:null,tab:null};render()});onclick("alerts",showNotifications);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.selectedCampaign=null;state.saleResult=null;state.attemptKey=null;state.trackerOrder=null;shell()});if(state.role==="ADMIN")return adminExceptionsScreen();if(state.role==="BUSINESS"&&state.tab===S.campaigns)return businessCampaigns();if(state.role==="BUSINESS"&&state.tab===S.orders)return businessOrdersScreen();if(state.role==="BUSINESS"&&state.tab===S.money)return businessMoney();if(state.role!=="EARNER")return placeholder();if(state.tab===S.home)return earnerHome();if(state.tab===S.sell)return sellScreen();if(state.tab===S.orders)return trackerOrders();if(state.tab===S.money)return moneyScreen()}
async function showNotifications(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">Notifications</h1>';try{const n=await A.notifications();v.innerHTML+=n.items.length?n.items.map(x=>'<div class="card"><strong>'+esc(x.title)+'</strong><p>'+esc(x.message)+'</p><span class="hint">'+new Date(x.createdAt).toLocaleString()+'</span></div>').join(""):'<div class="empty">No notifications yet.</div>';await A.readNotifications();const count=document.querySelector("#alertCount");if(count)count.textContent=""}catch(e){showLoadError(v,e)}}
async function adminExceptionsScreen(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">Exception console</h1><p class="muted">Only disputes, payment/refund issues and transactions stuck for 24+ hours appear here.</p>';try{const rows=await A.adminExceptions();v.innerHTML+=rows.length?rows.map(o=>'<div class="card"><span class="chip">'+esc(statusText(o.status))+'</span><h3>'+esc(o.campaign?.title||o.product)+'</h3><p>'+esc(o.business?.name||"")+' · '+esc(o.quantity)+' units</p><p class="muted">'+(o.disputes?.length?'Open dispute · ':'')+(o.payment?.status?'Payment '+esc(o.payment.status):'')+'</p></div>').join(""):'<div class="trust">No exceptions need attention.</div>'}catch(e){showLoadError(v,e)}}
function placeholder(){document.querySelector("#view").innerHTML='<h1 class="page-title">'+esc(state.tab)+'</h1><p class="muted">'+S.nextStage+'</p>'}
const npr=p=>new Intl.NumberFormat("en-NP",{maximumFractionDigits:2}).format(Number(p||0)/100);
const unitEarn=c=>{if(c.commissionBasis!=="PER_UNIT")return 0;return Math.round(Number(c.businessCommissionPaisa||0)*Number(c.earnerShareBps||10000)/10000)};
const statusText=x=>({SUBMITTED:S.statusSubmitted,CUSTOMER_CONFIRMED:S.statusConfirmed,ACCEPTED:S.statusAccepted,PAYMENT_PENDING:S.statusPayment,PAID:S.statusPaid,READY_FOR_PICKUP:S.statusReady,PICKED_UP:S.statusPicked,OUT_FOR_DELIVERY:S.statusDelivery,DELIVERED:S.statusDelivered,VERIFIED:S.statusVerified,PARTIALLY_DELIVERED:S.statusPartial,CANCELLED:S.statusCancelled,RETURNED:S.statusReturned,DISPUTED:S.statusDisputed}[x]||String(x||"").replaceAll("_"," ").toLowerCase());
async function earnerData(){const [campaigns,orders,earnings,performance]=await Promise.all([A.campaigns(),A.myOrders(),A.myEarnings(),A.myPerformance()]);return {campaigns:campaigns.filter(c=>c.type==="ORDER"&&c.commissionBasis==="PER_UNIT"),orders,earnings,performance}}
async function earnerHome(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.welcome+(state.user?.displayName?" "+esc(state.user.displayName):"")+'</h1><p class="muted">'+S.sellEarn+'</p>';try{const d=await earnerData();state.homeData=d;const payable=d.orders.flatMap(o=>o.settlements||[]).filter(x=>x.partyType==="EARNER"&&x.status==="PAYABLE").reduce((n,x)=>n+Number(x.amountPaisa||0),0),coming=Math.max(0,Number(d.earnings.balancePaisa||0)-payable);v.innerHTML+='<section class="section"><div class="money-grid"><div class="money"><span class="muted">Delivered</span><strong>'+d.performance.delivered+'</strong></div><div class="money"><span class="muted">Conversion</span><strong>'+d.performance.conversionRate+'%</strong></div></div></section><section class="section">'+(d.earnings.entries.length?'<div class="money-grid"><div class="money"><span class="muted">'+S.ready+'</span><strong>Rs '+npr(payable)+'</strong></div><div class="money"><span class="muted">'+S.onWay+'</span><strong>Rs '+npr(coming)+'</strong></div></div>':'<div class="empty">'+S.noEarnings+'</div>')+'<button class="btn secondary" disabled style="margin-top:12px">'+S.withdraw+' · '+S.nextStage+'</button><p class="hint">'+S.withdrawSoon+'</p></section><section class="section"><h2>'+S.sellEarn+'</h2><div id="products">'+productsHtml(d.campaigns)+'</div></section><section class="section"><h2>'+S.yourOrders+'</h2>'+ordersHtml(d.orders.slice(0,5),false)+'</section>';wireProducts()}catch(e){showLoadError(v,e)}}
function productsHtml(rows){if(!rows.length)return '<div class="empty">'+S.noProducts+'</div>';return rows.map(c=>'<button class="card product market-card" data-campaign="'+esc(c.id)+'">'+(c.mainImageData?'<img class="product-media" src="'+esc(c.mainImageData)+'" alt="'+esc(c.title)+'">':'')+'<div class="market-body"><div class="market-brand">'+esc(c.brandName||c.business?.name||"")+'</div><h3>'+esc(c.title)+'</h3><div class="market-price">Rs '+npr(c.unitPricePaisa)+' / '+esc(c.unitLabel||"unit")+'</div><div class="market-earn">Earn Rs '+npr(unitEarn(c))+' / '+esc(c.unitLabel||"unit")+'</div><div class="market-meta"><span>'+esc(c.serviceArea||c.city)+'</span><span>•</span><span>'+esc(c.remainingQuantity??c.availableQuantity??"")+' '+esc(c.unitLabel||"units")+' remaining</span></div></div></button>').join("")}
function wireProducts(){document.querySelectorAll("[data-campaign]").forEach(b=>b.onclick=()=>{const rows=state.homeData?.campaigns||state.campaigns||[];state.selectedCampaign=rows.find(c=>c.id===b.dataset.campaign);state.tab=S.sell;state.saleResult=null;state.saleMode=false;state.attemptKey=null;shell()})}
function galleryHtml(c){const imgs=[c.mainImageData,...(c.supportingImageData||[])].filter(Boolean);if(!imgs.length)return "";return '<img id="galleryMain" class="gallery-main" src="'+esc(imgs[0])+'" alt="'+esc(c.title)+'"><div class="gallery-strip">'+imgs.map((x,i)=>'<button type="button" data-gallery="'+i+'"><img src="'+esc(x)+'" alt="Product photo '+(i+1)+'"></button>').join("")+'</div>'}
function wireGallery(c){const imgs=[c.mainImageData,...(c.supportingImageData||[])].filter(Boolean);document.querySelectorAll("[data-gallery]").forEach(b=>b.onclick=()=>{document.querySelector("#galleryMain").src=imgs[Number(b.dataset.gallery)]})}
function campaignDetailHtml(c){const points=(c.sellingPoints||[]).map(x=>'<li>'+esc(x)+'</li>').join(""),faq=(Array.isArray(c.faq)?c.faq:[]).map(x=>'<details class="card"><summary>'+esc(x.question)+'</summary><p>'+esc(x.answer)+'</p></details>').join("");return '<button class="back" id="productBack">← '+S.back+'</button>'+galleryHtml(c)+'<div class="market-brand">'+esc(c.brandName||"")+'</div><h1 class="page-title">'+esc(c.title)+'</h1><p class="muted">'+esc(c.category||"")+' · '+esc(c.packSize||c.unitLabel||"")+'</p><div class="card summary"><div class="summary-row"><span>Selling price</span><strong>Rs '+npr(c.unitPricePaisa)+'</strong></div>'+(c.mrpPaisa?'<div class="summary-row"><span>MRP</span><strong>Rs '+npr(c.mrpPaisa)+'</strong></div>':'')+'<div class="summary-row"><span>Service area</span><strong>'+esc(c.serviceArea||c.city)+'</strong></div><div class="summary-row"><span>Available</span><strong>'+esc(c.remainingQuantity??c.availableQuantity??"—")+' '+esc(c.unitLabel||"units")+'</strong></div></div><p>'+esc(c.description||"")+'</p><h2>Why customers buy it</h2><ul class="sales-points">'+points+'</ul>'+(c.customerOffer?'<div class="offer"><strong>Customer offer</strong><p>'+esc(c.customerOffer)+'</p></div>':'')+'<div class="commission-box">Your commission<strong>Rs '+npr(unitEarn(c))+' per '+esc(c.unitLabel||"unit")+'</strong><span>100 '+esc(c.unitLabel||"units")+' × Rs '+npr(unitEarn(c))+' = Rs '+npr(unitEarn(c)*100)+'</span></div><div class="trust"><strong>Commission protected after verified delivery</strong><p>'+(c.business?.verified?'<span class="verified">✓ Verified business</span> · ':'')+esc(c.business?.name||"Business")+'</p><p>'+esc(c.successRule||"")+'</p></div><h2>Delivery</h2><p class="muted">'+esc(c.deliveryInfo||"")+'</p><h2>Campaign terms</h2><p class="muted">'+esc(c.campaignTerms||"")+'</p>'+faq+'<div class="inline-actions"><button class="smallbtn" id="copyPitch">Copy pitch</button><button class="smallbtn" id="shareProduct">Share product</button></div><div class="sticky-action"><button class="btn primary" id="startSelling">Start selling</button></div>'}

async function businessDecline(id,b){const reason=prompt(S.declineReason,S.declineDefault);if(!reason)return;b.disabled=true;b.textContent=S.declining;try{await A.declineOrder(id,reason);businessOrdersScreen()}catch(e){alert(plainError(e.message));b.disabled=false;b.textContent=S.decline}}
async function businessReady(id,b){b.disabled=true;b.textContent=S.markingReady;try{await A.readyOrder(id);businessOrdersScreen()}catch(e){alert(plainError(e.message));b.disabled=false;b.textContent=S.readyPickup}}
async function businessMoney(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">Performance</h1>';try{const p=await A.businessPerformance();v.innerHTML+='<div class="money-grid"><div class="money"><span class="muted">Units sold</span><strong>'+p.unitsSold+'</strong></div><div class="money"><span class="muted">GMV</span><strong>Rs '+npr(p.gmvPaisa)+'</strong></div><div class="money"><span class="muted">Active earners</span><strong>'+p.activeEarners+'</strong></div><div class="money"><span class="muted">Conversion</span><strong>'+p.conversionRate+'%</strong></div></div><div class="card"><span class="muted">Commission cost</span><h2>Rs '+npr(p.commissionCostPaisa)+'</h2></div><h2>Top earners</h2>'+(p.topEarners.length?p.topEarners.map((x,i)=>'<div class="card"><strong>#'+(i+1)+' '+esc(x.name)+'</strong><p>'+x.units+' units · '+x.orders+' completed orders</p></div>').join(""):'<div class="empty">No completed sales yet.</div>')}catch(e){showLoadError(v,e)}}
async function trackerOrders(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.yourOrders+'</h1>';try{const rows=state.role==="EARNER"?await A.myOrders():await A.businessOrders();state.trackerOrders=rows;if(!rows.length){v.innerHTML+='<div class="empty">'+(state.role==="EARNER"?S.noOrders:S.noBusinessOrders)+'</div>';return}if(state.trackerOrder){const fresh=rows.find(o=>o.id===state.trackerOrder.id);if(fresh)state.trackerOrder=fresh;return renderTracker(v,state.trackerOrder)}v.innerHTML+='<p class="muted">'+S.selectOrder+'</p>'+rows.map(o=>'<button class="card product track-order" data-track="'+esc(o.id)+'"><h3>'+esc(o.product)+'</h3><span class="chip">'+esc(statusText(o.status))+'</span><p class="muted">'+S.quantity+': '+esc(o.quantity)+'</p></button>').join("");document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{state.trackerOrder=rows.find(o=>o.id===b.dataset.track);renderTracker(v,state.trackerOrder)})}catch(e){showLoadError(v,e)}}
function trackerIndex(o){const s=o.status;if(["CANCELLED","RETURNED","DISPUTED","DELIVERY_FAILED","RETURN_IN_PROGRESS"].includes(s))return -1;if(s==="SUBMITTED")return 0;if(s==="CUSTOMER_CONFIRMED")return 1;if(s==="ACCEPTED"||s==="PAYMENT_PENDING")return 2;if(s==="PAID"||s==="READY_FOR_PICKUP")return 3;if(s==="PICKED_UP"||s==="OUT_FOR_DELIVERY")return 4;if(s==="DELIVERED")return 5;if(s==="VERIFIED"||s==="PARTIALLY_DELIVERED")return 6;return 0}
function trackerCommission(o){return Number(o.earnerRewardPaisaSnapshot||o.reward?.amountPaisa||0)}
function renderTracker(v,o){const idx=trackerIndex(o),steps=[[S.stepBuyer,S.stepBuyerHelp],[S.stepBusiness,S.stepBusinessHelp],[S.stepPay,S.stepPayHelp],[S.stepPickup,S.stepPickupHelp],[S.stepDelivery,S.stepDeliveryHelp],[S.stepQuantity,S.stepQuantityHelp],[S.stepPaid,S.stepPaidHelp]];v.innerHTML='<button class="back" id="trackerBack">← '+S.back+'</button><h1 class="page-title">'+S.trackOrder+'</h1><div class="card"><h3>'+esc(o.product)+'</h3><span class="chip">'+esc(statusText(o.status))+'</span>'+(state.role==="EARNER"?'<p class="earn">'+S.expectedCommission+': Rs '+npr(trackerCommission(o))+'</p>':'')+'</div><div class="trust">'+S.commissionReassurance+'</div><div class="timeline">'+steps.map((x,i)=>{const cls=idx<0?"upcoming":i<idx?"done":i===idx?"current":"upcoming";return '<div class="track-step '+cls+'"><span class="dot"></span><span class="step-label">'+(cls==="done"?S.completedStep:cls==="current"?S.currentStep:S.upcomingStep)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'}).join("")+'</div>'+disputeView(o)+'<button class="btn secondary" id="problem">'+S.somethingWrong+'</button><div id="problemForm"></div>';onclick("trackerBack",()=>{state.trackerOrder=null;state.role==="BUSINESS"?businessOrdersScreen():trackerOrders()});onclick("problem",()=>renderDisputeForm(o))}
function disputeView(o){const d=(o.disputes||[])[0];if(!d)return "";return '<div class="warn"><strong>'+S.problemOpen+'</strong><p>'+esc(d.reason)+'</p>'+(d.details?'<p class="muted">'+esc(d.details)+'</p>':'')+'</div>'}
function renderDisputeForm(o){const box=document.querySelector("#problemForm");box.innerHTML='<form id="disputeForm" class="card"><h3>'+S.reportProblem+'</h3><div class="field"><label for="reason">'+S.problemReason+'</label><select id="reason" name="reason" required><option value="">—</option><option>'+S.reasonWrongQuantity+'</option><option>'+S.reasonDelivery+'</option><option>'+S.reasonPayment+'</option><option>'+S.reasonProduct+'</option><option>'+S.reasonOther+'</option></select></div><div class="field"><label for="details">'+S.problemNote+'</label><textarea id="details" name="details"></textarea></div><div id="disputeError" role="alert"></div><button class="btn primary" id="disputeBtn">'+S.submitProblem+'</button></form>';document.querySelector("#disputeForm").onsubmit=e=>submitDispute(e,o)}
async function submitDispute(e,o){e.preventDefault();const f=new FormData(e.currentTarget),b=document.querySelector("#disputeBtn"),er=document.querySelector("#disputeError");b.disabled=true;b.textContent=S.sendingProblem;try{const d=await A.openDispute(o.id,f.get("reason"),f.get("details"));o.disputes=[d];o.status="DISPUTED";renderTracker(document.querySelector("#view"),o)}catch(x){er.className="error";er.textContent=plainError(x.message);b.disabled=false;b.textContent=S.submitProblem}}
async function moneyScreen(){const v=document.querySelector("#view");v.innerHTML='<h1 class="page-title">'+S.money+'</h1>';try{const d=await earnerData(),payable=d.orders.flatMap(o=>o.settlements||[]).filter(x=>x.partyType==="EARNER"&&x.status==="PAYABLE").reduce((n,x)=>n+Number(x.amountPaisa||0),0),coming=Math.max(0,Number(d.earnings.balancePaisa||0)-payable);v.innerHTML+=d.earnings.entries.length?'<div class="money-grid"><div class="money"><span class="muted">'+S.ready+'</span><strong>Rs '+npr(payable)+'</strong></div><div class="money"><span class="muted">'+S.onWay+'</span><strong>Rs '+npr(coming)+'</strong></div></div>':'<div class="empty">'+S.noEarnings+'</div>';v.innerHTML+='<button class="btn secondary" disabled style="margin-top:12px">'+S.withdraw+' · '+S.nextStage+'</button><p class="hint">'+S.withdrawSoon+'</p>'}catch(e){showLoadError(v,e)}}
function plainError(m){if(/cap/i.test(m))return S.capError;if(/already has an active|duplicate/i.test(m))return S.duplicateError;return m||S.authError}
function showLoadError(v,e){v.innerHTML+='<div class="error">'+esc(plainError(e.message)||S.loadError)+'</div><button class="btn secondary" id="retry">'+S.refresh+'</button>';onclick("retry",shell)}
let buyerTokenMemory="";\nfunction buyerToken(){if(buyerTokenMemory)return buyerTokenMemory;buyerTokenMemory=new URLSearchParams(location.search).get("token")||"";if(buyerTokenMemory)history.replaceState(null,"",location.pathname+location.hash);return buyerTokenMemory}
function buyerMoney(p){return "Rs "+npr(p)}
function buyerSummary(o){return '<div class="card summary"><div class="summary-row"><span>'+S.orderedFrom+'</span><strong>'+esc(o.business?.name||"EARN partner")+'</strong></div><div class="summary-row"><span>'+S.goods+'</span><strong>'+esc(o.product)+'</strong></div><div class="summary-row"><span>'+S.quantity+'</span><strong>'+esc(o.quantity)+'</strong></div><div class="summary-row"><span>'+S.price+'</span><strong>'+buyerMoney(o.unitPricePaisa)+'</strong></div><div class="summary-row"><span>'+S.total+'</span><strong>'+buyerMoney(o.productSubtotalPaisa)+'</strong></div></div>'}
async function buyerPage(){bottom.hidden=true;app.innerHTML='<div class="buyer-head"><div class="brand">'+S.brand+'</div><p class="muted">'+S.statusTitle+'</p></div>';const token=buyerToken();if(!token){app.innerHTML+='<div class="error">'+S.invalidLink+'</div>';return}try{const o=await A.buyerOrder(token);state.buyerOrder=o;renderBuyerState(o,token)}catch(e){app.innerHTML+='<div class="error">'+(/not found|invalid order token/i.test(e.message)?S.invalidLink:esc(plainError(e.message)))+'</div>'}}
function renderBuyerState(o,token){const base='<div class="buyer-head"><div class="brand">'+S.brand+'</div></div>';if(o.status==="SUBMITTED"){app.innerHTML=base+'<h1 class="page-title">'+S.confirmOrderTitle+'</h1>'+buyerSummary(o)+'<div id="buyerError" role="alert"></div><div class="buyer-actions"><button class="btn primary" id="confirmBuyer">'+S.yesOrder+'</button><button class="btn danger" id="rejectBuyer">'+S.noOrder+'</button></div>';onclick("confirmBuyer",()=>buyerConfirm(token));onclick("rejectBuyer",()=>buyerReject(token));return}if(o.status==="PAYMENT_PENDING"){return buyerPayment(o,token,base)}if(o.status==="DELIVERED"){return buyerDelivery(o,token,base)}const messages={CUSTOMER_CONFIRMED:S.waitingBusiness,ACCEPTED:S.waitingBusiness,PAID:S.paidMessage,READY_FOR_PICKUP:S.readyMessage,PICKED_UP:S.transitMessage,OUT_FOR_DELIVERY:S.transitMessage,CANCELLED:S.cancelledMessage,RETURNED:S.returnedMessage,DISPUTED:S.disputedMessage,VERIFIED:S.completedMessage,PARTIALLY_DELIVERED:S.partialDelivery,DELIVERY_FAILED:S.disputedMessage,RETURN_IN_PROGRESS:S.disputedMessage};app.innerHTML=base+'<h1 class="page-title">'+esc(statusText(o.status))+'</h1>'+buyerSummary(o)+'<div class="card"><p>'+esc(messages[o.status]||S.loadError)+'</p></div>'}
async function buyerConfirm(token){const b=document.querySelector("#confirmBuyer"),e=document.querySelector("#buyerError");b.disabled=true;b.textContent=S.confirmingOrder;try{const x=await A.confirmBuyerOrder(token);app.innerHTML='<div class="buyer-head"><div class="brand">'+S.brand+'</div></div><h1 class="page-title">'+S.statusConfirmed+'</h1><div class="card"><p>'+S.confirmedNext+'</p></div><div class="warn"><strong>'+S.savePinTitle+'</strong><p>'+S.savePinPrivate+'</p><div class="linkbox" id="buyerPin"></div><p class="muted">'+S.pinOnlyBuyer+'</p></div>';document.querySelector("#buyerPin").textContent=x.deliveryPin||""}catch(x){e.className="error";e.textContent=plainError(x.message);b.disabled=false;b.textContent=S.yesOrder}}
async function buyerReject(token){const b=document.querySelector("#rejectBuyer"),e=document.querySelector("#buyerError");b.disabled=true;b.textContent=S.rejectingOrder;try{const x=await A.rejectBuyerOrder(token);app.innerHTML='<div class="buyer-head"><div class="brand">'+S.brand+'</div></div><h1 class="page-title">'+(x.status==="DISPUTED"?S.statusDisputed:S.statusCancelled)+'</h1><div class="card"><p>'+(x.status==="DISPUTED"?S.refundReview:S.rejected)+'</p></div>'}catch(x){e.className="error";e.textContent=plainError(x.message);b.disabled=false;b.textContent=S.noOrder}}
function buyerPayment(o,token,base){const submitted=o.payment?.status==="SUBMITTED";app.innerHTML=base+'<h1 class="page-title">'+S.paymentTitle+'</h1><div class="trust">'+S.paymentTrust+'</div>'+buyerSummary(o)+'<div class="card summary"><div class="summary-row"><span>'+S.goods+'</span><strong>'+buyerMoney(o.productSubtotalPaisa)+'</strong></div><div class="summary-row"><span>'+S.delivery+'</span><strong>'+buyerMoney(o.deliveryFeePaisa)+'</strong></div><div class="summary-row"><span>'+S.amountToPay+'</span><strong>'+buyerMoney(o.payment?.amountPaisa||Number(o.productSubtotalPaisa||0)+Number(o.deliveryFeePaisa||0))+'</strong></div></div><h2>'+S.paymentInstructions+'</h2><div id="paymentDestination"></div>'+(submitted?'<div class="card"><strong>'+S.paymentSubmitted+'</strong><p class="muted">'+S.rejectAfterPayment+'</p></div>':'<form id="payForm"><div class="field"><label for="payMethod">'+S.paymentMethod+'</label><input id="payMethod" name="method" required></div><div class="field"><label for="payRef">'+S.paymentReference+'</label><input id="payRef" name="reference" required minlength="3"></div><div id="buyerError" role="alert"></div><button class="btn primary" id="payBtn">'+S.submitPayment+'</button></form>')+'<button class="btn danger" id="rejectBuyer" style="margin-top:12px">'+S.noOrder+'</button>';renderPaymentInstructions(o.paymentInstructions);if(!submitted)document.querySelector("#payForm").onsubmit=e=>buyerPay(e,token);onclick("rejectBuyer",()=>buyerReject(token))}
function renderPaymentInstructions(p){const root=document.querySelector("#paymentDestination");if(!p){root.className="placeholder";root.textContent=S.paymentPlaceholder;return}root.className="card summary";const row=(label,value)=>{if(!value)return;const d=document.createElement("div");d.className="summary-row";const a=document.createElement("span"),b=document.createElement("strong");a.textContent=label;b.textContent=String(value);d.append(a,b);root.append(d)};row(S.accountName,p.accountName);if(p.bank){row(S.bank,p.bank.name);row(S.bankAccount,p.bank.account)}if(p.eSewa)row(S.eSewa,p.eSewa.id);if(p.khalti)row(S.khalti,p.khalti.id);if(p.referenceFormat){row(S.referenceToUse,p.referenceFormat);const b=document.createElement("button");b.className="smallbtn";b.type="button";b.textContent=S.copyReference;b.onclick=async()=>{await navigator.clipboard.writeText(String(p.referenceFormat));b.textContent=S.referenceCopied};root.append(b)}if(p.qrImageUrl){try{const u=new URL(String(p.qrImageUrl));if(u.protocol==="https:"){const img=document.createElement("img");img.alt=S.paymentQr;img.src=u.href;img.loading="lazy";img.referrerPolicy="no-referrer";img.style.cssText="display:block;max-width:260px;width:100%;height:auto;margin:16px auto 0;border-radius:12px";root.append(img)}}catch{}}}
async function buyerPay(e,token){e.preventDefault();const f=new FormData(e.currentTarget),b=document.querySelector("#payBtn"),er=document.querySelector("#buyerError");b.disabled=true;b.textContent=S.submittingPayment;try{await A.submitBuyerPayment(token,f.get("method"),f.get("reference"));await buyerPage()}catch(x){er.className="error";er.textContent=plainError(x.message);b.disabled=false;b.textContent=S.submitPayment}}
function buyerDelivery(o,token,base){app.innerHTML=base+'<h1 class="page-title">'+S.deliveryTitle+'</h1>'+buyerSummary(o)+'<form id="deliveryForm"><div class="field"><label for="receivedQty">'+S.receivedQuantity+'</label><input id="receivedQty" name="quantity" type="number" min="0" max="'+esc(o.quantity)+'" value="'+esc(o.quantity)+'" required></div><div class="field"><label for="deliveryPin">'+S.deliveryPin+'</label><input id="deliveryPin" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><span class="hint">'+S.deliveryPinHelp+'</span></div><div id="buyerError" role="alert"></div><button class="btn primary" id="deliveryBtn">'+S.confirmDelivery+'</button></form>';document.querySelector("#deliveryForm").onsubmit=e=>buyerVerify(e,token,o)}
async function buyerVerify(e,token,o){e.preventDefault();const f=new FormData(e.currentTarget),qty=Number(f.get("quantity")),b=document.querySelector("#deliveryBtn"),er=document.querySelector("#buyerError");b.disabled=true;b.textContent=S.confirmingDelivery;try{const x=await A.verifyBuyerDelivery(token,qty,f.get("pin"));app.innerHTML='<div class="buyer-head"><div class="brand">'+S.brand+'</div></div><h1 class="page-title">'+(x.status==="PARTIALLY_DELIVERED"?S.statusPartial:S.statusVerified)+'</h1><div class="card"><p>'+(x.status==="PARTIALLY_DELIVERED"?S.partialDelivery:S.deliveryComplete)+'</p></div>'}catch(x){er.className="error";er.textContent=plainError(x.message);b.disabled=false;b.textContent=S.confirmDelivery}}
function onclick(id,fn){document.querySelector("#"+id).onclick=fn}
async function boot(){if(!A.token())return render();try{const u=await A.me();state.user=u;state.role=u.role;if(!["EARNER","BUSINESS","ADMIN"].includes(u.role)){A.clearToken();return render()}state.screen="shell";state.tab=u.role==="EARNER"?S.home:u.role==="ADMIN"?"Exceptions":S.campaigns}catch{A.clearToken()}render()}boot();
</script></body></html>
